<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbotsend | Plataforma Corporativa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070a13;
            --card-bg: #111827;
            --card-inner: #1e293b;
            --primary: #00ff88;
            --secondary: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --whatsapp: #25D366;
            --danger: #ff4757;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            /* FONDO TECH MATRIX POR CSS PURO (NUNCA FALLA NI SE PONE NEGRO) */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.1) 0%, transparent 60%),
                linear-gradient(rgba(0, 255, 136, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
        }

        header {
            background: #0f172a;
            padding: 2.5rem 1.5rem 2rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .logo-title {
            font-size: 3rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 0.6rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .block-section {
            padding: 3rem 0 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .feature-card {
            background: var(--card-bg);
            padding: 1.8rem 1.5rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .feature-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.8rem;
        }

        .feature-card h3 {
            color: #ffffff;
            margin-bottom: 0.5rem;
            font-size: 1.15rem;
        }

        .feature-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .download-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            align-items: center;
            margin: 0 auto;
            max-width: 1050px;
        }

        .banner-container {
            text-align: center;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
