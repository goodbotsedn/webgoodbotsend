<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GODBOTSEND | Plataforma Corporativa de Automatización & Leads</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(15, 23, 42, 0.85);
            --primary: #00ff88;
            --secondary: #00d2ff;
            --accent: #9d4edd;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --whatsapp: #25D366;
            --danger: #ff4757;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* FONDO MATRIX CANVAS */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.18;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        /* NAVEGACIÓN Y HEADER CORPORATIVO */
        header {
            background: linear-gradient(180deg, rgba(5, 8, 17, 0.98), rgba(15, 23, 42, 0.9));
            backdrop-filter: blur(12px);
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 4px 30px rgba(0, 255, 136, 0.05);
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--primary);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .logo-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00d2ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-top: 0.8rem;
            font-weight: 300;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* SECCIONES Y DIVISIONES */
        .block-section {
            padding: 4rem 0 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.3rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: var(--text-dim);
            font-size: 1.05rem;
        }

        /* 1. SECCIÓN PRINCIPAL: GOODBOTSEND & APLICATIVO */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .feature-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 2rem 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.15);
        }

        .feature-icon {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .feature-card h3 {
            color: #fff;
            margin-bottom: 0.6rem;
            font-size: 1.2rem;
        }

        .feature-card p {
            color: var(--text-dim);
            font-size: 0.92rem;
            line-height: 1.5;
        }

        /* MÓDULO DE DESCARGA CON CONTRASEÑA */
        .download-box {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(5, 8, 17, 0.9));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 136, 0.35);
            border-radius: 20px;
            padding: 2.8rem 2rem;
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.12);
        }

        .download-box h3 {
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .download-box h3 i {
            color: var(--primary);
        }

        .download-box p {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group input {
            width: 100%;
