<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbotsend | Plataforma Corporativa de Automatización & Leads</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050811;
            --card-bg: rgba(15, 23, 42, 0.88);
            --card-inner: rgba(30, 41, 59, 0.92);
            --primary: #00ff88;
            --secondary: #00d2ff;
            --accent: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --whatsapp: #25D366;
            --danger: #ff4757;
            --border-color: rgba(0, 255, 136, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* CANVAS MATRIX ANIMADO - FONDO */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
        }

        /* CONTENEDOR PRINCIPAL */
        .content-wrapper {
            position: relative;
            z-index: 2;
        }

        /* HEADER CORPORATIVO */
        header {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 25px rgba(0, 255, 136, 0.15);
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .logo-title {
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        header p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-top: 0.8rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .block-section {
            padding: 3.5rem 0 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* BLOQUE 1: CARACTERÍSTICAS GOODBOTSEND */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .feature-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 2rem 1.5rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s, border-color 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .feature-icon {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .feature-card h3 {
            color: #ffffff;
            margin-bottom: 0.6rem;
            font-size: 1.2rem;
        }

        .feature-card p {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }

        /* SECCIÓN DE DESCARGA CON IMAGEN AL LADO */
        .download-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            align-items: center;
            margin: 0 auto;
            max-width: 1050px;
        }

        .banner-container {
            text-align: center;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        .banner-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            object-fit: cover;
        }

        .download-box {
            background: var(--card-inner);
            backdrop-filter: blur(16px);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.15);
        }

        .download-box h3 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .download-box h3 i {
            color: var(--primary);
        }

        .download-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #050811;
            color: #ffffff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-bottom: 1.2rem;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
        }

        .btn-download {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: #050811;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .btn-download:hover {
            background: #00d873;
        }

        .error-msg {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* BLOQUE 2: PAQUETES Y PROSPECCIÓN */
        .coverage-bar {
            background: rgba(0, 210, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid var(--secondary);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 2.5rem;
            color: var(--secondary);
            font-weight: 700;
            font-size: 1rem;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .pkg-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s;
        }

        .pkg-card:hover {
            transform: translateY(-5px);
        }

        .pkg-card.blue { border-top: 4px solid #00d2ff; }
        .pkg-card.teal { border-top: 4px solid #00ffc8; }
        .pkg-card.purple { border-top: 4px solid #9d4edd; }
        .pkg-card.green { border-top: 4px solid #00ff88; }

        .pkg-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
        }
