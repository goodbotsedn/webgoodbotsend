<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbotsend | Plataforma Corporativa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050811;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* FONDO MATRIX ANIMADO POR CSS (SIN JAVASCRIPT - 100% GARANTIZADO QUE NO SE PONE NEGRO) */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.15;
            background-image: radial-gradient(#00ff88 1px, transparent 0);
            background-size: 24px 24px;
            animation: matrixMove 20s linear infinite;
        }

        @keyframes matrixMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }

        .main-wrapper {
            position: relative;
            z-index: 2;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            padding: 2rem 1.5rem 1.8rem;
            text-align: center;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 0.35rem 1.1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
        }

        .logo-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        header p {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-top: 0.5rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .block-section {
            padding: 2.5rem 0 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .section-header h2 {
            font-size: 1.9rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        .section-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .feature-card {
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(6px);
            padding: 1.5rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .feature-icon {
            font-size: 1.8rem;
            color: #00ff88;
            margin-bottom: 0.6rem;
        }

        .feature-card h3 {
            color: #ffffff;
            margin-bottom: 0.4rem;
            font-size: 1.1rem;
        }

        .feature-card p {
            color: #94a3b8;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        /* SECCIÓN DE DESCARGA JUNTO A LA IMAGEN PROMOCIONAL */
        .download-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
            align-items: center;
            margin: 0 auto;
            max-width: 1000px;
        }

        .banner-container {
            text-align: center;
            background: rgba(17, 24, 39, 0.92);
            border-radius: 14px;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .banner-container img {
            width: 100%;
            max-height: 380px;
            border-radius: 10px;
            display: block;
            object-fit: contain;
            margin: 0 auto;
        }

        .download-box {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #00ff88;
            border-radius: 14px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .download-box h3 {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-box h3 i {
            color: #00ff88;
        }

        .download-box p {
            color: #94a3b8;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0f172a;
            color: #ffffff;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            margin-bottom: 1rem;
        }

        .input-group input:focus {
            border-color: #00ff88;
        }

        .btn-download {
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            border: none;
            background: #00ff88;
            color: #050811;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .error-msg {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .coverage-bar {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid #00d2ff;
            border-radius: 10px;
            padding: 0.8rem;
            text-align: center;
            margin-bottom: 2rem;
            color: #00d2ff;
            font-weight: 700;
            font-size: 0.92rem;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .pkg-card {
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 14px;
